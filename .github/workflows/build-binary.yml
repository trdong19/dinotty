name: Build Binary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action/setup@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: Remove src-tauri workspace member
        run: sed -i '/members = \["src-tauri"\]/d' Cargo.toml

      - name: Build binary
        run: |
          cargo build --release -p dinotty-server --target x86_64-unknown-linux-musl
          strip target/x86_64-unknown-linux-musl/release/dinotty-server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dinotty-server-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/dinotty-server
          retention-days: 30
